<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athar · أثر</title>
<meta name="description" content="أثر: من مجالس العلم مواعظ وآيات… نقتفي بها أثر السالكين إلى الله. مصادر كل منشور، وشكرنا لأصحاب الفضل.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Lalezar&display=swap" rel="stylesheet">
<style>
  :root{
    --sand-1:#f3e9d6; --sand-2:#e6d3b1; --ink:#3a2a1c; --ink-soft:#6b5640;
    --ochre:#a8752f; --card:#fbf6ec; --line:#dcc7a3; --chip:#efe2c8; --on:#3a2a1c; --on-ink:#fbf6ec;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --sand-1:#221a12; --sand-2:#2c2218; --ink:#f1e8d6; --ink-soft:#c9b796;
      --ochre:#d9a85b; --card:#2a2017; --line:#4a3a28; --chip:#3a2d1f; --on:#d9a85b; --on-ink:#221a12;
    }
  }
  :root[data-theme="dark"]{
    --sand-1:#221a12; --sand-2:#2c2218; --ink:#f1e8d6; --ink-soft:#c9b796;
    --ochre:#d9a85b; --card:#2a2017; --line:#4a3a28; --chip:#3a2d1f; --on:#d9a85b; --on-ink:#221a12;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,var(--sand-1),var(--sand-2));color:var(--ink);
    font-family:"Cairo",system-ui,sans-serif;min-height:100vh;line-height:1.7}
  main{max-width:560px;margin:0 auto;padding:32px 16px 48px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  header{text-align:center;margin-bottom:20px}
  header img{width:120px;height:120px;border-radius:50%;box-shadow:0 6px 24px rgba(58,42,28,.18)}
  .tag{color:var(--ink-soft);margin:12px 0 0;font-size:18px}
  .links{display:grid;gap:10px;margin:20px 0 8px}
  .btn{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--ink);
    text-decoration:none;font-weight:600;font-size:17px}
  .btn small{color:var(--ink-soft);font-weight:400;direction:ltr}
  .btn:hover{border-color:var(--ochre)}
  .tabs{display:flex;gap:6px;margin:30px 0 14px;background:var(--chip);padding:5px;border-radius:14px}
  .tabs button{flex:1;border:0;background:transparent;font:inherit;font-weight:700;color:var(--ink);
    padding:10px;border-radius:10px;cursor:pointer;font-size:16px}
  .tabs button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .tools{display:grid;gap:10px;margin-bottom:14px}
  input[type=search]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);font:inherit;font-size:16px}
  .filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .filters button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
    font:inherit;font-size:14px;padding:5px 12px;border-radius:999px;cursor:pointer}
  .filters button[aria-pressed="true"]{background:var(--on);color:var(--on-ink);border-color:var(--on)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
  .card h3{margin:0;font-size:17px}
  .meta{color:var(--ink-soft);font-size:13px;margin:2px 0 6px}
  .card p{margin:4px 0;font-size:15px}
  .who{color:var(--ochre);font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{background:var(--chip);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--ink);text-decoration:none}
  a.chip:hover{outline:1px solid var(--ochre)}
  .more{display:block;width:100%;margin-top:6px;padding:12px;border-radius:12px;border:1px dashed var(--line);
    background:transparent;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
  .more[hidden]{display:none}
  input[type=search][hidden]{display:none}
  .empty{text-align:center;color:var(--ink-soft);padding:20px 0}
  footer{text-align:center;color:var(--ink-soft);font-size:14px;margin-top:36px}
</style>
</head>

<script src="data.js"></script>
<script>
(() => {
  const FIRST = 2;   // posts shown when the page opens
  const PAGE = 6;    // posts added by each «عرض المزيد»
  const SEARCH_FROM = 30; // the search box only appears once there are this many posts
  const people = window.PEOPLE || {};
  const posts = [...(window.POSTS || [])];
  const state = { q: "", filter: "all", shown: FIRST };

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  };
  const chipLink = (l) => {
    const a = el("a", "chip", l.label);
    a.href = l.url; a.rel = "noopener"; a.target = "_blank";
    return a;
  };

  // Filters: "all", each content type, then each person who appears in a post.
  const types = [...new Set(posts.map(p => p.type).filter(Boolean))];
  const usedPeople = Object.keys(people).filter(id => posts.some(p => p.people.includes(id)));
  const filters = [{ id: "all", label: "الكل" }]
    .concat(types.map(t => ({ id: "type:" + t, label: t })))
    .concat(usedPeople.map(id => ({ id: "person:" + id, label: people[id].name })));

  const filtersBox = document.getElementById("filters");
  filters.forEach(f => {
    const b = el("button", "", f.label);
    b.type = "button";
    b.dataset.id = f.id;
    b.addEventListener("click", () => { state.filter = f.id; state.shown = FIRST; render(); });
    filtersBox.appendChild(b);
  });

  const matches = (p) => {
    if (state.filter.startsWith("type:") && p.type !== state.filter.slice(5)) return false;
    if (state.filter.startsWith("person:") && !p.people.includes(state.filter.slice(7))) return false;
    if (!state.q) return true;
    const hay = [p.title, p.source, p.type, ...p.people.map(id => (people[id] || {}).name || "")].join(" ");
    return hay.includes(state.q);
  };

  const postCard = (p) => {
    const c = el("article", "card");
    c.appendChild(el("h3", "", p.title));
    c.appendChild(el("div", "meta", p.type));
    const names = p.people.map(id => people[id]).filter(Boolean);
    if (names.length) c.appendChild(el("p", "who", names.map(n => n.name).join(" • ")));
    if (p.source) c.appendChild(el("p", "", p.source));
    const chips = el("div", "chips");
    p.links.forEach(l => chips.appendChild(chipLink(l)));
    names.forEach(n => n.links[0] && chips.appendChild(chipLink({ label: n.name + " • " + n.links[0].label, url: n.links[0].url })));
    if (chips.children.length) c.appendChild(chips);
    return c;
  };

  const render = () => {
    [...filtersBox.children].forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === state.filter)));
    const list = posts.filter(matches);
    const box = document.getElementById("posts");
    box.replaceChildren(...list.slice(0, state.shown).map(postCard));
    if (!list.length) box.appendChild(el("p", "empty", "لا توجد نتائج."));
    document.getElementById("more").hidden = list.length <= state.shown;
  };

  document.getElementById("more").addEventListener("click", () => { state.shown += PAGE; render(); });
  document.getElementById("q").addEventListener("input", (e) => { state.q = e.target.value.trim(); state.shown = FIRST; render(); });

  // People directory: each person once, with their official links and how many posts credit them.
  const peopleBox = document.getElementById("people");
  Object.entries(people).forEach(([id, p]) => {
    const c = el("article", "card");
    c.appendChild(el("h3", "", p.name));
    const n = posts.filter(x => x.people.includes(id)).length;
    c.appendChild(el("div", "meta", [p.role, n ? "المنشورات: " + n.toLocaleString("ar-EG") : ""].filter(Boolean).join(" • ")));
    const chips = el("div", "chips");
    p.links.forEach(l => chips.appendChild(chipLink(l)));
    c.appendChild(chips);
    peopleBox.appendChild(c);
  });

  const tabs = [["tab-posts", "panel-posts"], ["tab-people", "panel-people"]];
  tabs.forEach(([t, panel]) => document.getElementById(t).addEventListener("click", () => {
    tabs.forEach(([t2, p2]) => {
      document.getElementById(t2).setAttribute("aria-selected", String(t2 === t));
      document.getElementById(p2).hidden = p2 !== panel;
    });
  }));

  document.getElementById("q").hidden = posts.length < SEARCH_FROM;
  render();
})();
</script>
